<!doctype html><meta charset="utf-8"><body><script type="module">
// 학점별 결과 카드 여섯 장을 한 장으로
import { loadArtSource, buildArt } from "./js/art.js"
import { makeCard } from "./js/card.js"
import { PRESETS, DEFAULT_STU, sanitizeProf, sanitizeStu } from "./js/config.js"
import { loadFonts } from "./js/text.js"
await loadArtSource(); try { await loadFonts?.() } catch {}
await document.fonts?.ready
const art = buildArt({ prof: sanitizeProf(PRESETS[1]), stu: DEFAULT_STU })
const stats = { parries: 12, perfect: 5, crits: 40, maxCombo: 33 }
const cases = [[0, "lose"], [2, "timeout"], [4, "quit"], [7, "timeout"], [12, "lose"], [16, "timeout"]]
const cards = cases.map(([n, result]) => makeCard(art, { result, run: { streak: n, defeated: [], time: 200, last: "사회대 박OO 교수", lastCollege: "soc", ups: n ? "날 선 타건 2 · 더블 클릭 1" : "" }, stats, stu: sanitizeStu({ ...DEFAULT_STU, college: "nur" }), record: { best: 9 } }))
const sc = 1 / 3, out = document.createElement("canvas"); out.width = (1080 * sc + 8) * 3; out.height = (1350 * sc + 8) * 2
const g = out.getContext("2d"); g.imageSmoothingEnabled = false
cards.forEach((c, i) => g.drawImage(c, (i % 3) * (1080 * sc + 8), Math.floor(i / 3) * (1350 * sc + 8), 1080 * sc, 1350 * sc))
await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ sheet: out.toDataURL() }) })
</script>
