<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<script type="module">
// 연속 대전 한 번을 끝까지 돌려 본다: 이기면 자동으로 다음 교수님, 난이도 상승, 일시정지, 패배 카드, 교수님 목록 링크
import { encodeRoster } from "./js/config.js"
const log = [], shots = {}
const f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms))
async function boot(src) { f.src = src; await new Promise((r) => (f.onload = r)); const w = f.contentWindow; for (let i = 0; i < 600 && !(w.__jg && w.__jg.art); i++) await wait(50); return w }
async function until(w, cond, ms = 6000) { const t0 = performance.now(); while (!cond() && performance.now() - t0 < ms) { const b = w.__jg.battle; if (b) for (let i = 0; i < 5; i++) b.update(0.02); await wait(5) } return cond() }
function winNow(b) { b.intro = 0; b.attack = null; b.nextAttack = 99; b.grad = null; b.summons = 2; b.phase = 2; b.hp = 1; b.lastTap = -9; b.t += 0.2; b.tap() }
try {
  localStorage.clear(); localStorage.setItem("jg-seen-help", "true")
  let w = await boot("index.html"), d = f.contentDocument
  log.push("roster " + w.__jg.roster.length + ": " + w.__jg.roster.map((p) => p.name).join(","))
  d.getElementById("b-fight").click(); await wait(100)
  let b = w.__jg.battle; const L0 = { hp: b.L.hp, tele: b.L.tele[0], dmg: b.L.dmg[0], prof: b.prof.name }
  winNow(b); log.push("after win -> next screen: " + await until(w, () => w.__jg.screen === "next"))
  log.push("next info: " + d.getElementById("next-info").textContent)
  log.push("auto start: " + await until(w, () => w.__jg.screen === "battle", 5000))
  b = w.__jg.battle; const L1 = { hp: b.L.hp, tele: b.L.tele[0], dmg: b.L.dmg[0], prof: b.prof.name, stage: b.stage, sleep: b.sleep }
  log.push("stage0 " + JSON.stringify(L0) + " stage1 " + JSON.stringify(L1))
  // 시계를 눌러 일시정지 → 계속
  const cv = d.getElementById("game"), r = cv.getBoundingClientRect()
  const px = r.left + 165.5 * r.width / 180, py = r.top + 15.5 * r.height / cv.height
  d.elementFromPoint(px, py).dispatchEvent(new w.PointerEvent("pointerdown", { clientX: px, clientY: py, bubbles: true }))
  log.push("pause: screen " + w.__jg.screen + ", paused " + b.paused)
  const t0 = b.t; b.update(0.05); log.push("time frozen while paused: " + (b.t === t0))
  d.getElementById("b-resume").click(); log.push("resume: screen " + w.__jg.screen + ", paused " + b.paused)
  // 두 번 더 이기고 (난이도 3), 그다음 진다
  winNow(b); await until(w, () => w.__jg.screen === "next"); d.getElementById("b-next").click(); await wait(50)
  b = w.__jg.battle; log.push("stage2 prof " + b.prof.name + " hp " + b.L.hp + " tele " + b.L.tele[0].toFixed(2) + " quiz " + b.L.quiz + " decoy " + b.L.decoy.toFixed(2))
  b.intro = 0; b.finish("lose"); log.push("lose -> result: " + await until(w, () => w.__jg.screen === "result"))
  log.push("record " + JSON.stringify(w.__jg.record))
  shots.card = d.getElementById("card").src
  // 다시 열어도 목록·기록 유지
  w = await boot("index.html"); log.push("reload record best " + w.__jg.record.best + ", roster " + w.__jg.roster.length)
  // 친구 링크: 교수님 2명 + 5연승
  const code = encodeRoster([{ name: "홍OO", lines: ["하하"], glasses: "horn", hair: "white", outfit: "turtle", level: "hard" }, { name: "서OO" }])
  w = await boot("index.html?r=" + code + "&s=5"); d = f.contentDocument
  log.push("challenge banner: " + d.getElementById("challenge").textContent + " / button " + d.getElementById("b-fight").textContent)
  d.getElementById("b-fight").click(); await wait(100)
  log.push("challenge fight prof " + w.__jg.battle.prof.name + " level " + w.__jg.battle.prof.level + ", run list " + w.__jg.run.list.length)
} catch (e) { log.push("ERR " + e.stack) }
await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ log, shots }) })
</script>
