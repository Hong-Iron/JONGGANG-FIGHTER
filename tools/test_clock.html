<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<script type="module">
// 도전 전체 4분 30초: 교수님을 넘어가도 시계가 이어지는지, 강화 고르는 동안 멈추는지, 다 쓰면 계절학기로 끝나는지
const log = [], f = document.getElementById("f"), wait = (ms) => new Promise((r) => setTimeout(r, ms))
async function boot() {
  for (let t = 0; t < 4; t++) {
    f.src = "index.html?x=" + Math.random(); await new Promise((r) => (f.onload = r))
    const w = f.contentWindow; for (let i = 0; i < 200 && !(w.__jg && w.__jg.art); i++) await wait(50)
    if (w.__jg && w.__jg.art) return w
  }
  throw new Error("boot failed")
}
async function until(w, cond, ms = 6000) { const t0 = performance.now(); while (!cond() && performance.now() - t0 < ms) { const b = w.__jg.battle; if (b) for (let i = 0; i < 5; i++) b.update(0.02); await wait(5) } return cond() }
try {
  localStorage.clear(); localStorage.setItem("jg-seen-help", "true"); localStorage.setItem("jg-stu", JSON.stringify({ college: "eng" })); localStorage.setItem("jg-lb-url", "http://127.0.0.1:8767")
  const w = await boot(), d = f.contentDocument
  w.__jg.startRun(); for (let i = 0; i < 100 && !w.__jg.battle; i++) await wait(50)
  let b = w.__jg.battle; log.push("start clock " + b.timeLeft)
  b.nextAttack = 999; for (let i = 0; i < 500; i++) b.update(0.02)                     // 10초 (시작 연출 1.1초는 안 셈)
  log.push("after 10s: " + b.timeLeft.toFixed(1))
  b.attack = null; b.grad = null; b.summons = 2; b.phase = 2; b.hp = 1; b.lastTap = -9; b.t += 0.2; b.tap()
  await until(w, () => w.__jg.screen === "next")
  log.push("next info: " + d.getElementById("next-info").textContent)
  await wait(1500); log.push("run clock while picking: " + w.__jg.run.timeLeft.toFixed(1))
  d.querySelector("#up-pick .up-card").click(); d.getElementById("b-next").click(); await wait(200)
  b = w.__jg.battle; log.push("2nd fight starts at " + b.timeLeft.toFixed(1) + " (stage " + b.stage + ")")
  b.nextAttack = 999; b.timeLeft = 0.5; for (let i = 0; i < 40; i++) b.update(0.02)
  log.push("result: " + await until(w, () => w.__jg.screen === "result", 6000))
  await wait(300)
  log.push("record last " + w.__jg.record.last)
} catch (e) { log.push("ERR " + e.stack) }
await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ log }) })
</script>
