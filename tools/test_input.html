<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" style="width:390px;height:844px;border:0"></iframe>
<script>
// 실제 클릭처럼 좌표 아래 요소에 이벤트를 보내 반박 표시·함정·연타·스킬을 확인한다 (폰 크기, 늘어난 천장 포함)
const log = []
localStorage.clear(); localStorage.setItem("jg-seen-help", "true"); localStorage.setItem("jg-stu", JSON.stringify({ college: "eng" })); localStorage.setItem("jg-lb-url", "http://127.0.0.1:8767")
const f = document.getElementById("f")
f.onload = async () => {
  if (!f.contentWindow.location.href.includes("index.html")) return       // 처음 빈 페이지
  const w = f.contentWindow, d = f.contentDocument, wait = (ms) => new Promise((r) => setTimeout(r, ms))
  for (let i = 0; i < 200 && !(w.__jg && w.__jg.art); i++) await wait(50)
  const cv = d.getElementById("game")
  const at = (lx, ly) => { const r = cv.getBoundingClientRect(); return [r.left + (lx + 0.5) * r.width / 180, r.top + (ly + 0.5) * r.height / cv.height] }
  const press = (lx, ly) => { const [x, y] = at(lx, ly), el = d.elementFromPoint(x, y); el.dispatchEvent(new w.PointerEvent("pointerdown", { clientX: x, clientY: y, bubbles: true, cancelable: true })); return el.id || el.tagName }
  try {
    d.getElementById("b-fight").click(); await wait(200)
    const b = w.__jg.battle, ex = b.ex
    log.push("canvas h " + cv.height + ", ex " + ex)
    b.intro = 0; b.nextAttack = 99
    const t0 = b.stats.taps; press(90, 120 + ex); await wait(100); press(90, 40); await wait(100)
    log.push("arena taps (incl. ceiling): " + (b.stats.taps - t0))
    // 반박 표시를 눌러 막기
    b.startAttack(); b.attack.hitAt = 5; b.attack.e = b.attack.appear + 0.1
    const a = b.attack, p0 = b.stats.parries, pf0 = b.stats.perfect
    log.push("attack: tx " + a.tx + " ty " + a.ty + " appear " + a.appear.toFixed(2) + " e " + a.e.toFixed(2) + " done " + a.done + " cine " + JSON.stringify(b.cine) + " over " + b.over)
    log.push("main.js has cv.height mapping: " + (await (await fetch("js/main.js", { cache: "no-store" })).text()).includes("cv.height / r.height"))
    const r0 = cv.getBoundingClientRect(); log.push("rect " + JSON.stringify([r0.width, r0.height]) + " cv " + cv.width + "x" + cv.height)
    log.push("target hit: " + press(a.tx + 20, a.ty + 10 + ex) + ", parries +" + (b.stats.parries - p0) + ", perfect +" + (b.stats.perfect - pf0))
    if (!(b.stats.parries - p0)) { b.attack = a; a.done = false; b.pointer(a.tx + 20, a.ty + 10 + ex); log.push("direct pointer parries +" + (b.stats.parries - p0)) }
    // 표시가 아닌 곳을 누르면 그냥 연타 (반박 안 됨)
    await wait(200); b.startAttack(); b.attack.hitAt = 5; b.attack.e = b.attack.appear + 0.5
    const a2 = b.attack, tx = (a2.tx > 90 ? 20 : 150), p1 = b.stats.parries, taps1 = b.stats.taps
    press(tx, 200 + ex); log.push("miss target: parries +" + (b.stats.parries - p1) + ", taps +" + (b.stats.taps - taps1) + ", attack still on " + !b.attack.done)
    // 함정 누르기 → 수면량 감소
    b.attack.decoy = true; b.attack.dx = a2.tx > 90 ? 10 : 120; b.attack.dy = 60
    const s0 = b.sleep; press(b.attack.dx + 20, b.attack.dy + 10 + ex)
    log.push("decoy: sleep " + s0 + " -> " + b.sleep + ", decoy gone " + !b.attack.decoy)
    // 스킬 칸 (넓어진 칸)
    b.caff = 100; b.cd.can = 0; press(90, 290 + ex); log.push("skill 2 haste " + b.haste.toFixed(1))
    // Space 반박: 공격 없을 때 → 감소
    b.attack = null; b.parryLock = 0; const s1 = b.sleep; w.dispatchEvent(new w.KeyboardEvent("keydown", { key: " " })); log.push("space whiff: " + s1 + " -> " + b.sleep)
  } catch (e) { log.push("ERR " + e.stack) }
  await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ log }) })
}
f.src = "index.html"

</script>
