<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="index.html" style="width:400px;height:700px;border:0"></iframe>
<script>
const log = []
const f = document.getElementById("f")
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  for (let i = 0; i < 60 && !(w.__jg && w.__jg.art); i++) await wait(100)
  // 실제처럼: 좌표 아래에 있는 요소에 이벤트를 보낸다
  const at = (lx, ly) => { const r = d.getElementById("game").getBoundingClientRect(); return [r.left + (lx + 0.5) * r.width / 180, r.top + (ly + 0.5) * r.height / 320] }
  const press = (lx, ly) => {
    const [x, y] = at(lx, ly), el = d.elementFromPoint(x, y)
    el.dispatchEvent(new w.PointerEvent("pointerdown", { clientX: x, clientY: y, bubbles: true, cancelable: true }))
    return el.id || el.tagName
  }
  const click = (sel) => { const el = d.querySelector(sel), r = el.getBoundingClientRect(), t = d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); t.focus(); t.click(); return t.id }
  log.push("start btn hit: " + click("#b-fight"))
  await wait(300)
  const b = w.__jg.battle
  log.push("battle: " + !!b)
  b.nextAttack = 99; b.intro = 0
  const before = b.stats.taps
  log.push("arena target: " + press(90, 120))
  await wait(120); press(90, 120); await wait(120); press(60, 200)
  log.push("taps by click: " + (b.stats.taps - before))
  // 키보드 J, 그리고 포커스 남은 버튼에 Enter
  w.dispatchEvent(new w.KeyboardEvent("keydown", { key: "j" })); await wait(100)
  log.push("taps after J: " + (b.stats.taps - before))
  const ev = new w.KeyboardEvent("keydown", { key: "Enter", cancelable: true }); w.dispatchEvent(ev)
  log.push("Enter prevented: " + ev.defaultPrevented + ", same battle: " + (w.__jg.battle === b) + ", focus: " + (d.activeElement && d.activeElement.tagName))
  // 공격이 없을 때 반박 버튼 클릭 → 헛반박
  const s0 = b.sleep
  log.push("parry target: " + press(137, 295))
  log.push("whiff: sleep " + s0 + " -> " + b.sleep + ", whiffs " + b.stats.whiffs)
  press(137, 295)
  log.push("during lock: sleep " + b.sleep + " (no double penalty)")
  // 너무 일찍: 공격 시작 직후
  await wait(500); b.startAttack(); b.attack.hitAt = 5; const s1 = b.sleep
  press(137, 295); log.push("early: sleep " + s1 + " -> " + b.sleep)
  // 제때: 맞기 직전
  await wait(500); b.parryLock = 0; b.startAttack(); b.attack.hitAt = b.attack.e + 0.1; const s2 = b.sleep, p0 = b.stats.parries
  press(137, 295); log.push("on time: parries +" + (b.stats.parries - p0) + ", sleep " + s2 + " -> " + b.sleep)
  // 스킬 칸 클릭
  b.caff = 100; b.cd.can = 0; press(48, 290); log.push("skill can haste: " + b.haste.toFixed(1))
  await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ log }) })
}
</script>
