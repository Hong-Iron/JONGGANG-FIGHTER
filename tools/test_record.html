<!doctype html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" style="width:400px;height:700px;border:0"></iframe>
<script>
const log = [], shots = {}
localStorage.clear()
const f = document.getElementById("f")
const wait = (ms) => new Promise((r) => setTimeout(r, ms))
async function boot(src) { f.src = src; await new Promise((r) => (f.onload = r)); const w = f.contentWindow; for (let i = 0; i < 300 && !(w.__jg && w.__jg.art); i++) await wait(100); return w }
async function play(w, result) {
  w.__jg.startBattle(); const b = w.__jg.battle
  b.intro = 0; b.nextAttack = 99
  if (result === "win") { b.grad = null; b.summons = 2; b.phase = 2; b.hp = 1; b.lastTap = -9; b.t += 0.2; b.tap() } else { b.finish("lose") }
  for (let i = 0; i < 400 && w.__jg.battle; i++) { b.update(0.02); await wait(1) }
  await wait(300)
}
;(async () => {
  try {
    let w = await boot("index.html")
    log.push("first screen: " + f.contentDocument.querySelector(".screen.on").id)
    await play(w, "win"); await play(w, "win")
    log.push("record after 2 wins: " + localStorage.getItem("jg-record"))
    shots.card2 = f.contentDocument.getElementById("card").src
    // 다시 열어도 남는지
    w = await boot("index.html")
    log.push("reload screen: " + f.contentDocument.querySelector(".screen.on").id + ", record " + JSON.stringify(w.__jg && localStorage.getItem("jg-record")))
    await wait(400); shots.title = f.contentDocument.getElementById("game").toDataURL()
    // 공유 링크에 연승이 실리는지
    const m = await import("./js/config.js")
    const link = m.profLink({ name: "이OO" }, 2)
    log.push("link has s=2: " + /[?&]s=2(&|$)/.test(link))
    w = await boot(link.replace(location.origin + "/", ""))
    log.push("banner: " + f.contentDocument.getElementById("challenge").textContent)
    await play(w, "lose")
    log.push("record after loss: " + localStorage.getItem("jg-record"))
    shots.cardLose = f.contentDocument.getElementById("card").src
  } catch (e) { log.push("ERR " + e.stack) }
  await fetch("http://127.0.0.1:8766/r", { method: "POST", body: JSON.stringify({ log, shots }) })
})()
</script>
